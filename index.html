<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Code Template Manager Multi-User Fixed</title>
<style>
:root{
    --bg:#0b0b0f;
    --card:#14141f;
    --ungu:#8a2be2;
    --hijau:#39ff14;
    --text:#eaeaea;
}
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
}
h1{text-align:center;color:var(--ungu);}
.box, .template{
    background:var(--card);
    max-width:900px;
    margin:15px auto;
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(138,43,226,0.3);
}
input, select, textarea{
    width:100%;
    margin-top:8px;
    padding:8px;
    background:#000;
    color:var(--hijau);
    border:1px solid var(--ungu);
    font-family:monospace;
}
textarea{min-height:120px;}
button{
    margin-top:10px;
    padding:8px;
    border:none;
    cursor:pointer;
    background:var(--ungu);
    color:white;
    border-radius:4px;
    transition:0.2s;
}
button:hover{opacity:0.85;}
button:focus, button:active{outline:none;background-color:#7a1be0;}
pre{
    background:#000;
    color:var(--hijau);
    padding:10px;
    overflow-x:auto;
    border-left:4px solid var(--ungu);
}
.actions button{
    margin-right:5px;
    background:#222;
    border:1px solid var(--hijau);
    color:var(--hijau);
}
.hapus{border-color:red;color:red;}
.login{max-width:400px;margin:100px auto;}
small{color:var(--hijau);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login box">
    <h2>Login</h2>
    <input id="username" placeholder="Masukkan username" />
    <button onclick="login()">Masuk</button>
</div>

<!-- APP -->
<div id="app" style="display:none">
<h1>Code Template Manager</h1>

<div class="box">
    <input id="judul" placeholder="Judul Template" />
    <select id="bahasa">
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
        <option>PHP</option>
        <option>Python</option>
    </select>
    <textarea id="kode" placeholder="Tempel codingan di sini..."></textarea>
    <button onclick="simpan()">Simpan Template</button>
    <button onclick="logout()">Logout</button>
</div>

<div class="box">
    <input id="search" placeholder="Cari template..." onkeyup="tampil()" />
</div>

<div id="list"></div>

</div>

<script>
// ===================== Multi-User Fixed =====================
let user = localStorage.getItem("loginUser");
let allData = JSON.parse(localStorage.getItem("allTemplates")) || {};

if(user){ showApp(); }

function login(){
    let u = document.getElementById("username").value.trim();
    if(u === ""){ alert("Username wajib diisi!"); return; }
    localStorage.setItem("loginUser", u);
    if(!allData[u]) allData[u] = [];
    localStorage.setItem("allTemplates", JSON.stringify(allData));
    showApp();
}

function logout(){
    localStorage.removeItem("loginUser");
    location.reload();
}

function showApp(){
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").style.display = "block";
    tampil();
}

// ===================== Template Functions =====================
function simpan(){
    let judul = document.getElementById("judul").value.trim();
    let bahasa = document.getElementById("bahasa").value;
    let kode = document.getElementById("kode").value.trim();
    if(judul === "" || kode === "") {
        alert("Judul dan kode wajib diisi!");
        return;
    }

    allData[user].push({judul, bahasa, kode});
    localStorage.setItem("allTemplates", JSON.stringify(allData));

    document.getElementById("judul").value = "";
    document.getElementById("kode").value = "";
    tampil();
}

function tampil(){
    let q = document.getElementById("search").value.toLowerCase();
    let list = document.getElementById("list");
    list.innerHTML = "";
    let data = allData[user] || [];

    data.forEach((t,i) => {
        if(t.judul.toLowerCase().includes(q)){
            list.innerHTML += `
            <div class="template">
                <h3>${t.judul} <small>(${t.bahasa})</small></h3>
                <pre>${escapeHtml(t.kode)}</pre>
                <div class="actions">
                    <button onclick="copy(${i})">Copy</button>
                    <button onclick="exportTxt(${i})">Export</button>
                    <button class="hapus" onclick="hapus(${i})">Hapus</button>
                </div>
            </div>`;
        }
    });
}

function copy(i){
    let kode = allData[user][i].kode;
    navigator.clipboard.writeText(kode);
    alert("Kode berhasil di-copy!");
}

function exportTxt(i){
    let kode = allData[user][i].kode;
    let blob = new Blob([kode], {type: "text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = allData[user][i].judul + ".txt";
    a.click();
}

function hapus(i){
    if(confirm("Hapus template ini?")){
        allData[user].splice(i,1);
        localStorage.setItem("allTemplates", JSON.stringify(allData));
        tampil();
    }
}

function escapeHtml(t){
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>

</body>
</html>
